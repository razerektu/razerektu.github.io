  d.querySelectorAll('#socials .social').forEach(card=>{
    const label=card.querySelector('strong')?.textContent.trim();
    const src=icons[label];
    if(!src)return;
    let img=card.querySelector('.social-logo');
    if(!img){
      img=d.createElement('img');
      img.className='social-logo';
      img.alt='';
      card.appendChild(img);
    }
    img.src=src;
  });

  const addCommunityDiscordButton=()=>{
    const buttons=[...d.querySelectorAll('a.btn')];
    const tiktok=buttons.find(link=>link.textContent.trim().replace(/\\s+/g,' ')==='TIKTOK');
    if(!tiktok || d.getElementById('community-discord-hero')) return;
    const button=d.createElement('a');
    button.id='community-discord-hero';
    button.className='btn';
    button.href='https://discord.gg/Z4XRezmNnN';
    button.target='_blank';
    button.rel='noopener';
    button.textContent='DISCORD';
    tiktok.insertAdjacentElement('afterend',button);
  };

  const fixLinks=()=>{
    const links=d.querySelectorAll('a');
    links.forEach(link=>{
      const label=link.textContent.trim().replace(/\\s+/g,' ');
      if(label.includes('WATCH RLBS')){
        link.href='https://discord.gg/ht4SaHGaf2';
        link.target='_blank';
        link.rel='noopener';

      if(label.includes('JOIN THE COMMUNITY')){
        link.href='https://discord.gg/8WpbjTtqhD';
        link.target='_blank';
        link.rel='noopener';
      }
    });
  };
