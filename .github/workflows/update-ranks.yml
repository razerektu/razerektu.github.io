name: Update Rocket League Ranks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-ranks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tracker client
        run: python -m pip install --upgrade pip curl_cffi

      - name: Fetch current Rocket League ranks
        run: python update-ranks.py

      - name: Save changed ranks
        run: |
          if git diff --quiet -- ranks.json; then
            echo "Ranks have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ranks.json
          git commit -m "Update Rocket League ranks"
          git push
